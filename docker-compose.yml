# 云枢 OpsHub · 智能运维平台 —— docker-compose 一键部署
# 用法：
#   cp .env.example .env   # 按需修改
#   docker compose up -d --build
# 访问： http://localhost:8088  （前端）   后端 API: http://localhost:8088/api

services:
  postgres:
    image: postgres:16
    container_name: ophub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ophub

  redis:
    image: redis:7.4.10
    container_name: ophub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ophub

  backend:
    build:
      context: ./backend
    container_name: ophub-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: "720"
      ALLOW_ORIGINS: "*"
      UPLOAD_DIR: "/app/uploads"
      DEPLOY_BASE: "/data/jenkins_home/scripts/V2_Project_App_Init_Install/main/app_choice"
      SYSTEM_INIT_DIR: "/data/jenkins_home/scripts/V2_Project_App_Init_Install/main/system_init"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ansible-data:/etc/ansible
    networks:
      - ophub

  frontend:
    build:
      context: ./frontend
    container_name: ophub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT}:80"
    networks:
      - ophub

volumes:
  pgdata:
  redisdata:
  ansible-data:

networks:
  ophub:
    driver: bridge
