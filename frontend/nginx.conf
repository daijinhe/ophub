server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 模板/导出等 Excel 文件不缓存，避免下载到旧版本
    location ~* \.(xlsx|xls|csv)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 后端 API 反向代理（与前端同源，免去跨域；支持 WebSocket 升级）
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # ⚠️ 必须用 $http_host：$host 会**丢掉端口**（Host: localhost:8088 → localhost），
        # 而后端 WS 的 Origin 同源校验要拿它跟 Origin(http://localhost:8088) 比端口。
        # 用 $host 会让同源判定失败 → WebSocket 升级被 403 拒绝（v1.7.0~v1.7.1 的真实故障）。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
