<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="100%" height="100%" role="img" aria-label="Prometheus 监控平台">
<!--
  云枢 OpsHub · 智能运维平台
  Copyright (c) 2026 daijinhe <taichicho@foxmail.com>
  SPDX-License-Identifier: MIT
-->
  <!-- 监控大屏顶栏品牌图标（仅图形部分）。
       与 inspection-logo-icon.svg 同一套视觉语言，保证两个大屏并排看是「兄弟」而不是两个产品：
         ① 同尺寸圆角方块（96×96 / rx14）+ 内缩一圈半透明白描边
         ② 同色系渐变（蓝 → 深蓝），这里偏青一档以便一眼区分巡检 / 监控
         ③ 主体图形同样是「细描边 + 圆头端点」的线性图形（巡检是折线趋势，这里是仪表盘）
       文字（中文标题 / 英文副标）一律由页面用 HTML 渲染：
         ① 可独立控制字号
         ② 与下方时钟/日期共用同一条垂直中轴（图标绝对定位挂在文字块左侧，不参与文字宽度计算）
       viewBox 紧贴图形内容，渲染尺寸即可当图标尺寸，不留空白导致视觉重心偏移。 -->
  <defs>
    <linearGradient id="promIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="96" height="96" rx="14" fill="url(#promIconGrad)"/>
  <rect x="6" y="6" width="84" height="84" rx="10" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- 仪表盘：270° 圆弧（缺口朝下，给指针留出场） -->
  <path d="M20 68 A28 28 0 1 1 76 68" fill="none" stroke="#7dd3fc" stroke-width="5"
        stroke-linecap="round" opacity="0.55"/>
  <!-- 已用弧段：左起约 1/3，暗示「水位」 -->
  <path d="M20 68 A28 28 0 0 1 31.5 40.5" fill="none" stroke="#7dd3fc" stroke-width="5"
        stroke-linecap="round"/>
  <!-- 刻度：三个小圆点，与巡检图标的节点圆点同款 -->
  <circle cx="20" cy="68" r="3.2" fill="#7dd3fc"/>
  <circle cx="76" cy="68" r="3.2" fill="#7dd3fc"/>
  <!-- 指针 -->
  <line x1="48" y1="62" x2="64" y2="36" stroke="#e2e8f0" stroke-width="4"
        stroke-linecap="round"/>
  <circle cx="48" cy="62" r="5.2" fill="#0ea5e9" stroke="#e2e8f0" stroke-width="2.4"/>
</svg>
