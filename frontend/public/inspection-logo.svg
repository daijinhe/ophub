  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="titleGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0,15)">
    <rect x="0" y="0" width="96" height="96" rx="14" fill="url(#iconGrad)"/>
    <rect x="6" y="6" width="84" height="84" rx="10" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <polyline points="16,72 32,46 50,58 70,28 84,40" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="72" r="3.6" fill="#7dd3fc"/>
    <circle cx="32" cy="46" r="3.6" fill="#7dd3fc"/>
    <circle cx="50" cy="58" r="3.6" fill="#7dd3fc"/>
    <circle cx="70" cy="28" r="3.6" fill="#7dd3fc"/>
    <circle cx="84" cy="40" r="3.6" fill="#7dd3fc"/>
  </g>

  <g transform="translate(116,0)" filter="url(#titleGlow)">
    <text x="0" y="68" font-family="-apple-system, 'PingFang SC', 'Microsoft Yahei', sans-serif" font-size="46" font-weight="800" fill="url(#titleGrad)" letter-spacing="2">云枢 OpsHub</text>
  </g>

  <text x="116" y="98" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="6">XIANGYUN VM INSPECTION PLATFORM</text>
</svg>
